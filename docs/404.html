<!DOCTYPE html>

<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">
<title>מעביר להדגמה · איקס מדיה</title>
<script>
  (function () {
    var base = '/oren-tadgi-demo/';
    var p = location.pathname;
    var rest = p.indexOf(base) === 0 ? p.slice(base.length) : p.replace(/^\//, '');
    rest = rest.replace(/index\.html$/, '').replace(/\/$/, '');
    location.replace(base + (rest ? '#/' + rest : '#/') + (location.search ? '' : ''));
  })();
</script>
<style>body{font-family:Arial,sans-serif;text-align:center;padding:3rem;color:#555}</style>
</head>
