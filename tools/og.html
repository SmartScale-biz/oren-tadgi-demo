<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>תמונת שיתוף</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{inline-size:1200px;block-size:630px;font-family:Heebo,Arial,sans-serif;background:#262626;color:#fff;display:grid;grid-template-columns:1fr 470px;overflow:hidden}
.l{padding:70px 70px 60px;display:flex;flex-direction:column;gap:26px}
.l img{inline-size:330px}
h1{font-size:62px;line-height:1.08;font-weight:800}
h1 b{color:#FF5A6A}
p{font-size:28px;color:#D6D6D6;line-height:1.4}
.tag{margin-block-start:auto;display:inline-flex;align-self:flex-start;padding:10px 20px;border-radius:999px;background:#B81828;font-size:22px;font-weight:700}
.r{background:#F4F4F5;position:relative;padding:44px 34px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 24px -12px rgba(0,0,0,.3);padding:16px 18px;color:#1E1E1E;display:flex;align-items:center;gap:14px;border-inline-start:6px solid var(--c)}
.card b{font-size:21px;display:block}.card small{font-size:16px;color:#666}
.n{margin-inline-start:auto;font-size:30px;font-weight:800}
</style></head><body>
<div class="l"><img src="../docs/assets/logo-light.png" alt=""><h1>המערכת של<br><b>איקס מדיה</b>, מוכנה לאיפיון</h1><p>הזמנות, גרפיקה, ייצור, התקנות בשטח עם חתימה דיגיטלית, וסוף חודש בלי ערימה.</p><span class="tag">הדגמה עם נתוני דמה</span></div>
<div class="r">
<div class="card" style="--c:#FF3B30"><span><b>דלק קריית אתא</b><small>נשלח ללקוח לאישור</small></span><span class="n">!</span></div>
<div class="card" style="--c:#F59E0B"><span><b>הסידור של נועם · מחר</b><small>5 תחנות + יוקנעם שנשכחה</small></span><span class="n">5</span></div>
<div class="card" style="--c:#9C84E0"><span><b>תעודה נחתמה בשטח</b><small>מחסני השוק נשר · 08:50</small></span><span class="n">✓</span></div>
<div class="card" style="--c:#0F7A4A"><span><b>מוכנות לחשבונית</b><small>סוף החודש, בלחיצה אחת</small></span><span class="n">15</span></div>
</div></body></html>
